<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mare Girl · a Star Equestrian blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Coiny&family=Quicksand:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
/* ============ TOKENS ============ */
:root {
  --cream: #FBF5EA;
  --cream-2: #F4EAD5;
  --pink: #E8B4B0;
  --pink-2: #F3D2CE;
  --pink-3: #D99A9A;
  --pink-deep: #B86F6A;
  --brown: #7A4A33;
  --brown-deep: #5A3623;
  --brown-soft: #A87E66;
  --blue: #A8C8DE;
  --blue-2: #CADBE6;
  --blue-ink: #3D5A6B;
  --ink: #3B2A20;
  --ink-soft: #6E5648;
  --shadow: 0 10px 30px -12px rgba(122, 74, 51, 0.18);
  --shadow-lg: 0 24px 60px -24px rgba(122, 74, 51, 0.28);
  --radius: 22px;
  --radius-sm: 14px;
  --radius-lg: 32px;
  --pad: clamp(20px, 4vw, 56px);
  --maxw: 1180px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Quicksand', system-ui, sans-serif;
  background: var(--cream);
  color: var(--ink);
  font-size: 17px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

h1, h2, h3, h4 { font-family: 'Coiny', 'Quicksand', system-ui, sans-serif; font-weight: 400; letter-spacing: -0.01em; margin: 0; color: var(--brown-deep); }
h1 { font-size: clamp(34px, 5.4vw, 60px); line-height: 1.05; }
h2 { font-size: clamp(26px, 3.6vw, 38px); line-height: 1.1; }
h3 { font-size: 22px; line-height: 1.2; }

a { color: inherit; }

.app { display: flex; flex-direction: column; min-height: 100vh; }

/* ============ HEADER ============ */
.hdr {
  position: sticky; top: 0; z-index: 50;
  background: rgba(251, 245, 234, 0.92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(122, 74, 51, 0.08);
}
.hdr-inner {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 14px var(--pad);
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.brand { display: flex; align-items: center; gap: 12px; padding: 0; }
.brand-mark {
  width: 44px; height: 44px;
  background: var(--pink-2);
  border-radius: 50%;
  display: grid; place-items: center;
  box-shadow: var(--shadow);
}
.brand-text { display: flex; flex-direction: column; align-items: flex-start; line-height: 1; }
.brand-name { font-family: 'Coiny', sans-serif; font-size: 22px; color: var(--brown-deep); }
.brand-sub { font-family: 'Caveat', cursive; font-size: 15px; color: var(--pink-deep); margin-top: 2px; }

.nav-desktop { display: none; gap: 4px; }
.nav-link {
  position: relative;
  padding: 10px 14px;
  font-weight: 600;
  color: var(--brown);
  border-radius: 999px;
  transition: background .15s, color .15s;
}
.nav-link:hover { background: var(--pink-2); }
.nav-link.active { color: var(--brown-deep); }
.nav-underline {
  position: absolute; left: 14px; right: 14px; bottom: 4px; height: 3px;
  background: var(--pink-3); border-radius: 3px;
}

.menu-btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: var(--pink-2);
}
.burger { width: 20px; height: 16px; position: relative; }
.burger span {
  position: absolute; left: 0; right: 0; height: 2.5px; background: var(--brown-deep);
  border-radius: 2px; transition: transform .2s, opacity .2s, top .2s;
}
.burger span:nth-child(1) { top: 0; }
.burger span:nth-child(2) { top: 7px; }
.burger span:nth-child(3) { top: 14px; }
.burger.open span:nth-child(1) { top: 7px; transform: rotate(45deg); }
.burger.open span:nth-child(2) { opacity: 0; }
.burger.open span:nth-child(3) { top: 7px; transform: rotate(-45deg); }

.mob-menu {
  max-height: 0; overflow: hidden;
  transition: max-height .3s ease;
  background: var(--cream);
  border-bottom: 1px solid rgba(122, 74, 51, 0.08);
}
.mob-menu.open { max-height: 480px; }
.mob-link {
  display: flex; align-items: center; gap: 12px;
  width: 100%; padding: 14px var(--pad);
  font-size: 17px; font-weight: 600; color: var(--brown-deep);
  border-bottom: 1px solid rgba(122, 74, 51, 0.06);
  text-align: left;
}
.mob-link.active { background: var(--brown-deep); color: var(--cream); }

@media (min-width: 880px) {
  .nav-desktop { display: flex; }
  .menu-btn { display: none; }
  .mob-menu { display: none; }
}

/* ============ LAYOUT ============ */
main { flex: 1; }
.page {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: clamp(24px, 5vw, 56px) var(--pad) 80px;
  display: flex; flex-direction: column;
  gap: clamp(48px, 7vw, 88px);
}
.sec { display: flex; flex-direction: column; gap: 24px; }
.sec-tinted {
  background: var(--blue-2);
  margin: 0 calc(-1 * var(--pad));
  padding: clamp(36px, 5vw, 64px) var(--pad);
  border-radius: var(--radius-lg);
}
.sec-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.sec-kicker {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'Caveat', cursive;
  font-size: 20px; color: var(--pink-deep);
  margin-bottom: 4px;
}
.sec-title { color: var(--brown-deep); }
.link-btn { font-weight: 700; color: var(--pink-deep); padding: 4px 0; }
.link-btn:hover { color: var(--brown-deep); }

.grid { display: grid; gap: 24px; }
.grid-2 { grid-template-columns: 1fr; }
.grid-3 { grid-template-columns: 1fr; }
@media (min-width: 640px) {
  .grid-2 { grid-template-columns: 1fr 1fr; }
  .grid-3 { grid-template-columns: 1fr 1fr; }
}
@media (min-width: 960px) {
  .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
}

/* ============ HERO ============ */
.hero {
  display: grid;
  grid-template-columns: 1fr;
  gap: 40px;
  align-items: center;
}
.hero-text { display: flex; flex-direction: column; gap: 18px; }
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: 'Caveat', cursive; font-size: 22px;
  color: var(--pink-deep);
}
.hero-title { text-wrap: pretty; }
.ink-pink { color: var(--pink-deep); }
.hero-sub { font-size: 18px; color: var(--ink-soft); max-width: 52ch; }
.hero-cta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
.hero-stats {
  display: flex; gap: 28px; flex-wrap: wrap;
  margin-top: 14px; padding-top: 22px;
  border-top: 1.5px dashed rgba(122, 74, 51, 0.25);
}
.hero-stats > div { display: flex; flex-direction: column; }
.hero-stats strong { font-family: 'Coiny', sans-serif; font-size: 28px; color: var(--brown-deep); }
.hero-stats span { font-size: 13px; color: var(--ink-soft); }

.hero-art {
  position: relative;
  min-height: 380px;
}
.hero-card {
  position: absolute;
  background: var(--cream);
  padding: 10px 10px 14px;
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  width: 60%;
}
.hero-card-1 { top: 0; left: 0; transform: rotate(-4deg); }
.hero-card-2 { bottom: 0; right: 4%; transform: rotate(3deg); width: 52%; }
.hero-card-label {
  text-align: center; padding-top: 8px;
  font-family: 'Caveat', cursive; font-size: 19px; color: var(--brown);
}
.hero-blob {
  position: absolute; border-radius: 50%; z-index: -1;
}
.hero-blob-1 { width: 220px; height: 220px; background: var(--pink-2); top: -10px; right: 10%; opacity: .7; }
.hero-blob-2 { width: 140px; height: 140px; background: var(--blue); bottom: 18%; left: 8%; opacity: .65; }
.hero-stamp {
  position: absolute;
  width: 64px; height: 64px;
  background: var(--cream);
  border: 2px dashed var(--pink-3);
  border-radius: 50%;
  display: grid; place-items: center;
  top: 36%; right: -2%;
  transform: rotate(15deg);
  box-shadow: var(--shadow);
}

@media (min-width: 880px) {
  .hero { grid-template-columns: 1.05fr 1fr; gap: 56px; }
  .hero-art { min-height: 520px; }
}

/* ============ BUTTONS ============ */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 20px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 15px;
  transition: transform .12s, box-shadow .15s, background .15s, color .15s;
  white-space: nowrap;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn-pink { background: var(--pink); color: var(--brown-deep); box-shadow: 0 4px 0 var(--pink-deep); }
.btn-pink:hover { background: var(--pink-3); }
.btn-brown { background: var(--brown-deep); color: var(--cream); box-shadow: 0 4px 0 #2c1b13; }
.btn-brown:hover { background: var(--brown); }
.btn-outline { background: transparent; color: var(--brown-deep); box-shadow: inset 0 0 0 2px var(--brown-deep); }
.btn-outline:hover { background: var(--brown-deep); color: var(--cream); }
.btn-ghost { padding: 8px 14px; color: var(--ink-soft); }
.btn-ghost:hover { color: var(--pink-deep); }
.btn-lg { padding: 14px 24px; font-size: 16px; }
.btn-sm { padding: 8px 14px; font-size: 13px; }

/* ============ TAG ============ */
.tag {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}
.tag-pink { background: var(--pink-2); color: var(--pink-deep); }
.tag-blue { background: var(--blue-2); color: var(--blue-ink); }
.tag-brown { background: var(--brown-deep); color: var(--cream); }
.tag-cream { background: var(--cream-2); color: var(--brown); }

/* ============ PLACEHOLDERS ============ */
.ph {
  position: relative;
  width: 100%;
  border-radius: var(--radius-sm);
  overflow: hidden;
  display: grid; place-items: center;
}
.ph-label {
  font-family: ui-monospace, 'SF Mono', Menlo, monospace;
  font-size: 12px;
  padding: 6px 10px;
  background: rgba(251, 245, 234, 0.85);
  border-radius: 6px;
  max-width: 80%;
  text-align: center;
}

/* ============ POSTS ============ */
.post {
  background: var(--cream);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  border: 1.5px solid rgba(122, 74, 51, 0.06);
  display: flex; flex-direction: column;
  transition: transform .15s, box-shadow .2s;
}
.post:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.post-media { position: relative; }
.post-media .ph { border-radius: 0; }
.post-cat {
  position: absolute; top: 14px; left: 14px;
  background: var(--cream); color: var(--pink-deep);
  padding: 4px 12px; border-radius: 999px;
  font-size: 12px; font-weight: 700;
  letter-spacing: .02em;
}
.post-body { padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.post-meta { font-size: 13px; color: var(--ink-soft); display: flex; gap: 8px; align-items: center; }
.post-meta .dot { color: var(--pink-3); }
.post-title { line-height: 1.2; }
.post-excerpt { color: var(--ink-soft); font-size: 15px; flex: 1; }
.post-actions { display: flex; justify-content: space-between; align-items: center; padding-top: 8px; }
.heart { font-size: 18px; color: var(--brown-soft); transition: color .2s, transform .2s; }
.heart.lit { color: var(--pink-deep); transform: scale(1.15); }

.post-featured { display: grid; grid-template-columns: 1fr; }
@media (min-width: 760px) {
  .post-featured { grid-template-columns: 1.1fr 1fr; }
  .post-featured .post-body { padding: 32px 36px; justify-content: center; }
  .post-featured .post-title { font-size: 28px; }
}

/* ============ PAGE HEAD ============ */
.page-head { display: flex; flex-direction: column; gap: 12px; max-width: 720px; }
.page-title { color: var(--brown-deep); }
.page-lede { color: var(--ink-soft); font-size: 18px; }

/* ============ FILTERS ============ */
.filters {
  display: flex; flex-direction: column; gap: 16px;
  padding: 18px; border-radius: var(--radius);
  background: var(--cream-2);
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips-center { justify-content: center; }
.chip {
  padding: 8px 16px;
  border-radius: 999px;
  background: var(--cream);
  color: var(--brown);
  font-weight: 600; font-size: 14px;
  border: 1.5px solid transparent;
  transition: all .15s;
}
.chip:hover { border-color: var(--pink-3); }
.chip.active { background: var(--brown-deep); color: var(--cream); }
.filters-right { display: flex; gap: 10px; flex-wrap: wrap; }
.search {
  display: flex; align-items: center; gap: 8px;
  background: var(--cream);
  padding: 8px 14px; border-radius: 999px;
  flex: 1; min-width: 180px;
}
.search span { color: var(--brown-soft); font-size: 18px; }
.search input { border: 0; outline: 0; background: transparent; width: 100%; padding: 4px 0; }
.select {
  background: var(--cream);
  border: 0; outline: 0;
  padding: 10px 14px; border-radius: 999px;
  font-weight: 600; color: var(--brown);
}

.empty {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 56px 20px; text-align: center;
  background: var(--cream-2); border-radius: var(--radius);
}
.empty p { color: var(--ink-soft); }

/* ============ VIDEOS ============ */
.video {
  background: var(--cream);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  border: 1.5px solid rgba(122, 74, 51, 0.06);
}
.video:hover { box-shadow: var(--shadow-lg); }
.video-thumb {
  position: relative;
  display: block; width: 100%; padding: 0;
}
.video-thumb .ph { border-radius: 0; }
.video-thumb-img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; }
.video-feature-img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; border-radius: var(--radius-sm); }
.video-real {
  position: absolute; top: 10px; left: 10px;
  background: var(--pink-deep); color: var(--cream);
  font-size: 11px; font-weight: 700; letter-spacing: .04em;
  padding: 3px 8px; border-radius: 6px;
}
.shorts { display: flex; flex-direction: column; gap: 20px; }
.shorts-row {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}
@media (min-width: 600px) { .shorts-row { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 900px) { .shorts-row { grid-template-columns: repeat(5, 1fr); } }
.short-card {
  position: relative;
  border-radius: var(--radius-sm);
  overflow: hidden;
  box-shadow: var(--shadow);
  display: block;
  transition: transform .15s;
}
.short-card:hover { transform: translateY(-3px); }
.short-card .ph { border-radius: 0; }
.short-img { width: 100%; aspect-ratio: 9 / 16; object-fit: cover; display: block; background: #000; }
.post-img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
.img-slot { width: 100%; border-radius: var(--radius-sm); overflow: hidden; }
.img-slot-img { width: 100%; height: 100%; object-fit: cover; display: block; }
.img-slot-hint {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
  background: rgba(251, 245, 234, 0.92); color: var(--brown-deep);
  padding: 4px 10px; border-radius: 999px;
  font-size: 11px; font-weight: 700; letter-spacing: .04em;
  opacity: 0; transition: opacity .15s; pointer-events: none;
}
.img-slot:hover .img-slot-hint { opacity: 1; }
.img-slot-clear {
  position: absolute; top: 8px; right: 8px;
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--brown-deep); color: var(--cream);
  font-size: 16px; line-height: 1;
}
.post-userbadge {
  position: absolute; top: 14px; right: 14px;
  background: var(--brown-deep); color: var(--cream);
  padding: 4px 12px; border-radius: 999px;
  font-size: 11px; font-weight: 700; letter-spacing: .04em;
}

/* ============ POST DETAIL MODAL ============ */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(59, 42, 32, 0.55);
  backdrop-filter: blur(6px);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 20px;
  overflow-y: auto;
  animation: fadeIn .2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-post {
  background: var(--cream);
  border-radius: var(--radius-lg);
  max-width: 760px; width: 100%;
  margin: 20px auto;
  box-shadow: var(--shadow-lg);
  position: relative;
  overflow: hidden;
}
.modal-close {
  position: absolute; top: 14px; right: 14px; z-index: 5;
  width: 40px; height: 40px;
  background: var(--cream); color: var(--brown-deep);
  border-radius: 50%;
  font-size: 26px; line-height: 1;
  box-shadow: var(--shadow);
}
.modal-close:hover { background: var(--pink-2); }
.modal-cover { width: 100%; max-height: 360px; overflow: hidden; }
.modal-cover .ph { border-radius: 0; }
.modal-body { padding: clamp(20px, 4vw, 40px); display: flex; flex-direction: column; gap: 14px; }
.modal-title { font-size: clamp(28px, 4.5vw, 44px); line-height: 1.1; }
.modal-content p { color: var(--ink-soft); font-size: 17px; margin: 0 0 14px; }
.modal-footer {
  display: flex; gap: 10px; flex-wrap: wrap;
  padding-top: 14px;
  border-top: 1.5px dashed rgba(122, 74, 51, 0.2);
}

/* ============ NEW POST FORM ============ */
.modal-form .field { display: flex; flex-direction: column; gap: 6px; }
.modal-form .field > span {
  font-family: 'Caveat', cursive; font-size: 18px;
  color: var(--pink-deep);
}
.modal-form input,
.modal-form select,
.modal-form textarea {
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  background: #fff;
  border: 2px solid rgba(122, 74, 51, 0.12);
  outline: 0;
  font-size: 15px;
  resize: vertical;
}
.modal-form input:focus,
.modal-form select:focus,
.modal-form textarea:focus { border-color: var(--pink-3); }
.field-row { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 600px) { .field-row { grid-template-columns: 1fr 1fr; } }

/* ============ ADMIN ============ */
.admin-fab {
  position: fixed; bottom: 24px; right: 24px; z-index: 100;
  display: flex; align-items: center; gap: 10px;
  padding: 14px 22px;
  background: var(--brown-deep); color: var(--cream);
  border-radius: 999px;
  font-weight: 700;
  box-shadow: 0 8px 24px -8px rgba(0,0,0,0.4), 0 4px 0 #2c1b13;
  transition: transform .15s;
}
.admin-fab:hover { transform: translateY(-2px); }
.admin-fab-plus { font-size: 18px; color: var(--pink-2); }
.admin-key {
  position: fixed; bottom: 16px; left: 16px; z-index: 90;
  width: 28px; height: 28px;
  background: transparent;
  color: var(--brown-soft); opacity: .4;
  font-size: 12px;
  border-radius: 50%;
}
.admin-key:hover { opacity: 1; background: var(--cream-2); }

.admin-pill {
  position: fixed; bottom: 16px; left: 16px; z-index: 90;
  display: flex; align-items: center; gap: 6px;
  padding: 6px 10px 6px 14px;
  background: var(--pink-2); color: var(--pink-deep);
  border-radius: 999px;
  font-size: 13px; font-weight: 700;
  box-shadow: var(--shadow);
}
.admin-pill button {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--cream); color: var(--brown-deep);
  font-size: 12px;
}
.admin-pill button:hover { background: var(--pink-3); color: var(--cream); }

.modal-passcode { max-width: 460px; }
.modal-passcode.shake { animation: shakeX .4s ease; }
@keyframes shakeX {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-8px); }
  40%, 80% { transform: translateX(8px); }
}
.passcode-stamp {
  width: 70px; height: 70px;
  margin: 0 auto;
  background: var(--pink-2);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 0 var(--pink-3);
}
.passcode-err {
  background: rgba(217, 154, 154, 0.18);
  color: var(--pink-deep);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  text-align: center;
  font-weight: 600;
}
.save-toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
  background: var(--brown-deep); color: var(--cream);
  padding: 12px 22px; border-radius: 999px;
  font-weight: 700; font-size: 15px;
  box-shadow: 0 8px 24px -8px rgba(0,0,0,0.4);
  z-index: 110;
  animation: fadeIn .2s ease;
}

/* ============ EDITABLE TEXT (admin) ============ */
.editable {
  outline: 2px dashed rgba(217, 154, 154, 0.5);

<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

// ===================== ADMIN GATE =====================
// Visit ?admin=1 to unlock posting. Saved to localStorage thereafter.
const ADMIN_KEY = "maregirl_admin";
const PASSCODE_KEY = "maregirl_passcode_hash";

// Simple SHA-256 hash for passcode storage (so it's not plain text in localStorage)
const hashPasscode = async (code) => {
  const buf = new TextEncoder().encode("maregirl_salt::" + code);
  const hash = await crypto.subtle.digest("SHA-256", buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, "0")).join("");
};
const hasPasscode = () => !!localStorage.getItem(PASSCODE_KEY);
const verifyPasscode = async (code) => {
  const stored = localStorage.getItem(PASSCODE_KEY);
  if (!stored) return false;
  return (await hashPasscode(code)) === stored;
};
const setPasscodeHash = async (code) => {
  localStorage.setItem(PASSCODE_KEY, await hashPasscode(code));
};
const isAdmin = () => {
  try {
    // ?admin=0 always signs out
    const url = new URLSearchParams(window.location.search);
    if (url.get("admin") === "0") localStorage.removeItem(ADMIN_KEY);
    return localStorage.getItem(ADMIN_KEY) === "1";
  } catch { return false; }
};

// ===================== PASSCODE MODAL =====================

const PasscodeModal = ({ mode, onClose, onSuccess }) => {
  // mode: "set" | "enter" | "change"
  const [code, setCode] = useState("");
  const [confirm, setConfirm] = useState("");
  const [old, setOld] = useState("");
  const [err, setErr] = useState("");
  const [shake, setShake] = useState(false);
  const inputRef = useRef(null);

  useEffect(() => {
    inputRef.current?.focus();
    const onKey = e => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    document.body.style.overflow = "hidden";
    return () => { window.removeEventListener("keydown", onKey); document.body.style.overflow = ""; };
  }, [onClose]);

  const fail = (msg) => { setErr(msg); setShake(true); setTimeout(() => setShake(false), 400); };

  const submit = async (e) => {
    e.preventDefault();
    setErr("");
    if (mode === "set") {
      if (code.length < 4) return fail("at least 4 characters please ✿");
      if (code !== confirm) return fail("passcodes don't match");
      await setPasscodeHash(code);
      onSuccess();
    } else if (mode === "enter") {
      const ok = await verifyPasscode(code);
      if (!ok) return fail("nope — try again");
      onSuccess();
    } else if (mode === "change") {
      const ok = await verifyPasscode(old);
      if (!ok) return fail("old passcode is wrong");
      if (code.length < 4) return fail("at least 4 characters please ✿");
      if (code !== confirm) return fail("new passcodes don't match");
      await setPasscodeHash(code);
      onSuccess();
    }
  };

  const titles = {
    set: "Set your admin passcode",
    enter: "Welcome back, Mare Girl ✿",
    change: "Change your passcode",
  };
  const subs = {
    set: "First time here — pick something only you'll remember. You'll need it any time you want to post.",
    enter: "Enter your passcode to unlock admin mode.",
    change: "Confirm the old one, then pick a new passcode.",
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <form className={`modal-post modal-passcode ${shake ? "shake" : ""}`} onClick={e => e.stopPropagation()} onSubmit={submit}>
        <button type="button" className="modal-close" onClick={onClose} aria-label="Close">×</button>
        <div className="modal-body">
          <div className="passcode-stamp"><Horseshoe size={36} color="#7A4A33" /></div>
          <div className="hero-eyebrow" style={{ justifyContent: "center" }}><Sparkle size={14} color="#D99A9A" /> admin only</div>
          <h1 className="modal-title" style={{ textAlign: "center" }}>{titles[mode]}</h1>
          <p style={{ textAlign: "center", color: "var(--ink-soft)", margin: "0 0 8px" }}>{subs[mode]}</p>

          {mode === "change" && (
            <label className="field">
              <span>Old passcode</span>
              <input type="password" value={old} onChange={e => setOld(e.target.value)} autoComplete="current-password" />
            </label>
          )}

          <label className="field">
            <span>{mode === "set" ? "Choose a passcode" : mode === "change" ? "New passcode" : "Passcode"}</span>
            <input ref={inputRef} type="password" value={code} onChange={e => { setCode(e.target.value); setErr(""); }} autoComplete={mode === "enter" ? "current-password" : "new-password"} />
          </label>

          {(mode === "set" || mode === "change") && (
            <label className="field">
              <span>Confirm passcode</span>
              <input type="password" value={confirm} onChange={e => setConfirm(e.target.value)} autoComplete="new-password" />
            </label>
          )}

          {err && <div className="passcode-err">{err}</div>}

          <div className="modal-footer" style={{ justifyContent: "center" }}>
            <button type="submit" className="btn btn-brown btn-lg">
              {mode === "set" ? "✿ Set passcode" : mode === "enter" ? "Unlock ✿" : "Save new passcode"}
            </button>
            <button type="button" className="btn btn-outline" onClick={onClose}>Cancel</button>
          </div>
        </div>
      </form>
    </div>
  );
};
const POSTS_KEY = "maregirl_posts";
const DELETED_KEY = "maregirl_deleted";
const loadDeleted = () => { try { return JSON.parse(localStorage.getItem(DELETED_KEY) || "[]"); } catch { return []; } };
const saveDeleted = (l) => { try { localStorage.setItem(DELETED_KEY, JSON.stringify(l)); } catch {} };
const IMAGES_KEY = "maregirl_images";
const TEXTS_KEY = "maregirl_texts";
const LIKES_KEY = "maregirl_likes";
const loadLikes = () => { try { return JSON.parse(localStorage.getItem(LIKES_KEY) || "{}"); } catch { return {}; } };
const saveLikes = (m) => { try { localStorage.setItem(LIKES_KEY, JSON.stringify(m)); } catch {} };
const loadTexts = () => { try { return JSON.parse(localStorage.getItem(TEXTS_KEY) || "{}"); } catch { return {}; } };
const saveTexts = (m) => { try { localStorage.setItem(TEXTS_KEY, JSON.stringify(m)); } catch {} };

// Global editable context — read by <E> components
const EditCtx = React.createContext({ texts: {}, setTexts: () => {}, admin: false });

const E = ({ id, tag = "span", children, className, style, multiline = false, ...rest }) => {
  const { texts, setTexts, admin } = React.useContext(EditCtx);
  const ref = useRef(null);
  const Tag = tag;
  const saved = texts[id];
  const value = saved !== undefined ? saved : (typeof children === "string" ? children : null);

  // Keep DOM in sync only when not focused (to avoid caret jumping while typing)
  useEffect(() => {
    if (!admin || !ref.current) return;
    if (document.activeElement === ref.current) return;
    const want = value ?? "";
    if (ref.current.innerText !== want) ref.current.innerText = want;
  }, [value, admin]);

  if (!admin) {
    if (multiline && typeof value === "string") {
      return <Tag className={className} style={style} {...rest}>
        {value.split("\n").map((line, i) => <React.Fragment key={i}>{i > 0 && <br />}{line}</React.Fragment>)}
      </Tag>;
    }
    return <Tag className={className} style={style} {...rest}>{value ?? children}</Tag>;
  }

  return (
    <Tag
      ref={ref}
      contentEditable
      suppressContentEditableWarning
      className={`${className || ""} editable`}
      style={style}
      onBlur={(e) => {
        const text = multiline ? e.target.innerText : e.target.innerText.replace(/\n/g, " ");
        const next = { ...texts, [id]: text };
        setTexts(next);
        saveTexts(next);
      }}
      onKeyDown={(e) => {
        if (!multiline && e.key === "Enter") { e.preventDefault(); e.target.blur(); }
        if (e.key === "Escape") e.target.blur();
      }}
      {...rest}
    >
      {value ?? (typeof children === "string" ? children : "")}
    </Tag>
  );
};
const loadImages = () => { try { return JSON.parse(localStorage.getItem(IMAGES_KEY) || "{}"); } catch { return {}; } };
const saveImages = (m) => { try { localStorage.setItem(IMAGES_KEY, JSON.stringify(m)); } catch {} };

const ImageSlot = ({ slotKey, label, aspect = "3 / 4", tone = "pink", images, setImages, admin }) => {
  const ref = useRef(null);
  const src = images[slotKey];
  const onPick = (e) => {
    const f = e.target.files?.[0]; if (!f) return;
    const r = new FileReader();
    r.onload = ev => { const next = { ...images, [slotKey]: ev.target.result }; setImages(next); saveImages(next); };
    r.readAsDataURL(f);
  };
  const clear = (e) => { e.stopPropagation(); const next = { ...images }; delete next[slotKey]; setImages(next); saveImages(next); };
  return (
    <div className="img-slot" style={{ aspectRatio: aspect, position: "relative" }} onClick={() => admin && ref.current?.click()}>
      {src ? <img src={src} alt={label} className="img-slot-img" /> : <Placeholder label={label} aspect={aspect} tone={tone} />}
      {admin && (
        <React.Fragment>
          <input ref={ref} type="file" accept="image/*" onChange={onPick} style={{ display: "none" }} />
          <div className="img-slot-hint">{src ? "click to change" : "click to upload"}</div>
          {src && <button className="img-slot-clear" onClick={clear} title="Remove">×</button>}
        </React.Fragment>
      )}
    </div>
  );
};

  try { return JSON.parse(localStorage.getItem(POSTS_KEY) || "[]"); } catch { return []; }
};
const saveUserPosts = (list) => {
  try { localStorage.setItem(POSTS_KEY, JSON.stringify(list)); } catch {}
};

const Blog = ({ likes, onLike, posts, onRead, admin, onDelete, onNewPost, hiddenCount, onRestoreAll }) => {
  const [cat, setCat] = useState("All");
  const [q, setQ] = useState("");
  const [sort, setSort] = useState("Newest");

  const filtered = useMemo(() => {
    let list = posts.filter(p =>
      (cat === "All" || p.category === cat) &&
      (q === "" || (p.title + p.excerpt).toLowerCase().includes(q.toLowerCase()))
    );
    if (sort === "Most loved") list = [...list].sort((a, b) => {
      const aId = typeof a.id === "number" ? a.id : 1;
      const bId = typeof b.id === "number" ? b.id : 1;
      return ((likes[b.id]||0)+bId*7+23) - ((likes[a.id]||0)+aId*7+23);
    });
    return list;
  }, [cat, q, sort, likes, posts]);

  return (
    <div className="page">
      <section className="page-head">
        <E id="blog.eyebrow" tag="div" className="hero-eyebrow">the blog</E>
        <E id="blog.title" tag="h1" className="page-title">Field notes from the ranch</E>
        <E id="blog.lede" tag="p" className="page-lede" multiline>Diaries, guides, style hauls, and very long-winded thoughts about coat genetics. Filter your vibe below.</E>
        {admin && (
          <div style={{ marginTop: 10, display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
            <button className="btn btn-brown" onClick={onNewPost}>✚ New post</button>
            {hiddenCount > 0 && (
              <button className="btn btn-outline btn-sm" onClick={onRestoreAll}>
                ↺ Restore {hiddenCount} hidden post{hiddenCount === 1 ? "" : "s"}
              </button>
            )}
          </div>
        )}
      </section>

      <div className="filters">
        <div className="chips">
          {CATEGORIES.map(c => (
            <button
              key={c}
              className={`chip ${cat === c ? "active" : ""}`}
              onClick={() => setCat(c)}
            >
              {c}
            </button>
          ))}
        </div>
        <div className="filters-right">
          <div className="search">
            <span>⌕</span>
            <input
              placeholder="search posts…"
              value={q}
              onChange={e => setQ(e.target.value)}
            />
          </div>
          <select className="select" value={sort} onChange={e => setSort(e.target.value)}>
            <option>Newest</option>
            <option>Most loved</option>
          </select>
        </div>
      </div>

      {filtered.length === 0 ? (
        <div className="empty">
          <Horseshoe size={48} color="#D99A9A" />
          <h3>No posts here yet.</h3>
          <p>Try a different category or clear your search.</p>
        </div>
      ) : (
        <div className="grid grid-2">
          {filtered.map(p => <PostCard key={p.id} post={p} likes={likes} onLike={onLike} onRead={onRead} admin={admin} onDelete={onDelete} />)}
        </div>
      )}
    </div>
  );
};

const Names = () => {
  const [theme, setTheme] = useState("whimsy");
  const [current, setCurrent] = useState({ first: "Buttercup", second: "Bumble" });
  const [saved, setSaved] = useState([]);
  const [pulse, setPulse] = useState(false);
  const [copied, setCopied] = useState(null);

  const roll = () => {
    const t = NAME_PARTS[theme];
    const first = t.first[Math.floor(Math.random() * t.first.length)];
    const second = t.second[Math.floor(Math.random() * t.second.length)];
    setCurrent({ first, second });
    setPulse(true);
    setTimeout(() => setPulse(false), 380);
  };

  useEffect(() => { roll(); /* eslint-disable-next-line */ }, [theme]);

  const fullName = theme === "myth" ? `${current.first}${current.second}` : `${current.first} ${current.second}`;

  const save = () => {
    if (!saved.includes(fullName)) setSaved([fullName, ...saved].slice(0, 24));
  };

  const copy = (name) => {
    navigator.clipboard?.writeText(name);
    setCopied(name);
    setTimeout(() => setCopied(null), 1200);

  return (
    <div className="page">
      <section className="page-head">

              <button className="btn btn-pink" onClick={save}>♥ Save</button>

const Newsletter = () => {
  const [email, setEmail] = useState("");
  const [state, setState] = useState("idle"); // idle | err | ok | sending

  const submit = async (e) => {
    e.preventDefault();
    const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
    if (!ok) { setState("err"); return; }
    setState("sending");
    try {
      const res = await fetch("https://formspree.io/f/mjgllpab", {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({ email: email.trim(), source: "Mare Girl Blog newsletter" }),
      });
      if (!res.ok) throw new Error("formspree");
      setState("ok");
      setEmail("");
    } catch {
      setState("err");
    }
  };

  return (
    <section className="newsletter">
      <div className="news-inner">
        <div>
          <div className="hero-eyebrow"><Sparkle size={14} color="#D99A9A" /> the stable post</div>
          <h2 className="sec-title">Monthly-ish letters from the barn</h2>
          <p>Once a month: my favorite posts, new videos, and the weirdest names chat picked. No spam, just hooves.</p>
        </div>
        <form className="news-form" onSubmit={submit}>
          <input
            type="email"
            placeholder="your@email.com"
            value={email}
            onChange={e => { setEmail(e.target.value); setState("idle"); }}
            aria-invalid={state === "err"}
          />
          <button className="btn btn-brown" type="submit" disabled={state === "sending"}>
            {state === "sending" ? "sending…" : "Subscribe"}
          </button>
          {state === "err" && <div className="news-msg err">that doesn't look like an email, friend (or the send failed — try again)</div>}
          {state === "ok"  && <div className="news-msg ok">welcome to the barn ✿ check your inbox</div>}
        </form>
      </div>
    </section>
  );
};

  const [passcodePrompt, setPasscodePrompt] = useState(null); // null | "set" | "enter" | "change"
  const [reading, setReading] = useState(null);
  const [writing, setWriting] = useState(false);

  useEffect(() => {
    const ids = VIDEOS.filter(v => v.ytId).map(v => v.ytId);
    ids.forEach(id => {
      fetch(`https://www.youtube.com/oembed?url=https://youtu.be/${id}&format=json`)
        .then(r => r.ok ? r.json() : null)
        .then(d => { if (d?.title) setYtTitles(t => ({ ...t, [id]: d.title })); })
        .catch(() => {});
    });
  }, []);

  VIDEOS.forEach(v => { if (v.ytId && ytTitles[v.ytId]) v.title = ytTitles[v.ytId]; });

  const allPosts = useMemo(
    () => [...userPosts, ...BLOG_POSTS].filter(p => !deletedIds.includes(p.id)),
    [userPosts, deletedIds]
  );

  const onLike = (id) => setLikes(s => { const next = { ...s, [id]: (s[id] || 0) + 1 }; saveLikes(next); return next; });
  const flashSaved = () => { setSavedFlash(true); setTimeout(() => setSavedFlash(false), 1600); };
  const saveAll = () => {
    saveLikes(likes);
    saveImages(images);
    saveUserPosts(userPosts);
    saveDeleted(deletedIds);
    flashSaved();
    downloadBackup(); // auto-backup on every save
  };

  const downloadBackup = () => {
    const data = {
      version: 1,
      exportedAt: new Date().toISOString(),
      texts, likes, images, userPosts, deletedIds,
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `mare-girl-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

  const importBackup = () => {
    const input = document.createElement("input");
    input.type = "file"; input.accept = "application/json,.json";
    input.onchange = (e) => {
      const f = e.target.files?.[0]; if (!f) return;
      const r = new FileReader();
      r.onload = ev => {
        try {
          const d = JSON.parse(ev.target.result);
          if (d.texts) { setTexts(d.texts); saveTexts(d.texts); }
          if (d.likes) { setLikes(d.likes); saveLikes(d.likes); }
          if (d.images) { setImages(d.images); saveImages(d.images); }
          if (d.userPosts) { setUserPosts(d.userPosts); saveUserPosts(d.userPosts); }
          if (d.deletedIds) { setDeletedIds(d.deletedIds); saveDeleted(d.deletedIds); }
          flashSaved();
        } catch { alert("Couldn't read that file — make sure it's a Mare Girl backup .json"); }
      };
      r.readAsText(f);
    };
    input.click();
  };
  const onNav = (p) => { setPage(p); window.scrollTo({ top: 0, behavior: "smooth" }); };
  const onRead = (post) => setReading(post);
  const onSavePost = (post) => {
    const next = [post, ...userPosts];
    setUserPosts(next);
    saveUserPosts(next);
  };
  const onDeletePost = (id) => {
    if (!confirm("Delete this post? (You can restore it later from the admin panel.)")) return;
    const userMade = userPosts.some(p => p.id === id);
    if (userMade) {
      const next = userPosts.filter(p => p.id !== id);
      setUserPosts(next);
      saveUserPosts(next);
    } else {
      const next = [...deletedIds, id];
      setDeletedIds(next);
      saveDeleted(next);
    }
  };
  const onRestoreAll = () => {
    setDeletedIds([]);
    saveDeleted([]);
  };
  const toggleAdmin = () => {
    if (admin) {
      // Sign out — no passcode needed
      localStorage.removeItem(ADMIN_KEY);
      setAdmin(false);
    } else {
      // Need passcode — set one if none, otherwise prompt to enter
      setPasscodePrompt(hasPasscode() ? "enter" : "set");
    }
  };
  const onPasscodeSuccess = () => {
    localStorage.setItem(ADMIN_KEY, "1");
    setAdmin(true);
    setPasscodePrompt(null);
  };
  const onChangePasscode = () => setPasscodePrompt("change");

  return (
    <EditCtx.Provider value={{ texts, setTexts, admin }}>
    <div className="app">
      <Header page={page} onNav={onNav} menuOpen={menuOpen} setMenuOpen={setMenuOpen} />
      <main data-screen-label={page}>
        {page === "home"    && <Home onNav={onNav} likes={likes} onLike={onLike} posts={allPosts} onRead={onRead} images={images} setImages={setImages} admin={admin} />}
        {page === "blog"    && <Blog likes={likes} onLike={onLike} posts={allPosts} onRead={onRead} admin={admin} onDelete={onDeletePost} onNewPost={() => setWriting(true)} hiddenCount={deletedIds.length} onRestoreAll={onRestoreAll} />}
        {page === "videos"  && <Videos />}
        {page === "names"   && <Names />}
        {page === "updates" && <Updates />}
        {page === "about"   && <About onNav={onNav} images={images} setImages={setImages} admin={admin} />}
      </main>
      <Footer onNav={onNav} />

      {reading && <PostDetail post={reading} onClose={() => setReading(null)} likes={likes} onLike={onLike} />}
      {writing && <NewPostForm onClose={() => setWriting(false)} onSave={onSavePost} />}
      {passcodePrompt && (
        <PasscodeModal
          mode={passcodePrompt}
          onClose={() => setPasscodePrompt(null)}
          onSuccess={passcodePrompt === "change" ? () => setPasscodePrompt(null) : onPasscodeSuccess}
        />
      )}

      {admin && (
        <button className="admin-fab" onClick={() => setWriting(true)} title="New post (admin)">
          <span className="admin-fab-plus">✚</span>
          <span className="admin-fab-label">New post</span>
        </button>
      )}

      {admin ? (
        <div className="admin-pill">
          <span>✿ admin on</span>
          <button onClick={saveAll} title="Save + download backup">💾</button>
          <button onClick={importBackup} title="Restore from backup file">📂</button>
          <button onClick={onChangePasscode} title="Change passcode">🔑</button>
          <button onClick={toggleAdmin} title="Sign out">⎋</button>
        </div>
      ) : (
        <button
          className="admin-key"
          onClick={toggleAdmin}
          title="Unlock admin (Mare Girl only)"
          aria-label="admin"
        >·</button>
      )}
    </div>
    </EditCtx.Provider>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
